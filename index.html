<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japan Station Lift Finder — Find step-free stations & elevators</title>
  <meta name="description" content="Find which JR and metro stations in Japan have elevators (lifts) and step-free access, so you can pick an accessible hotel nearby." />

  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🛗</span>
      <div>
        <h1>Japan Station Lift Finder</h1>
        <p class="tagline">Find stations with elevators &amp; step-free access — then pick a hotel nearby.</p>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="sidebar" aria-label="Station search and results">
      <div class="controls">
        <label class="search-field">
          <span class="visually-hidden">Search station</span>
          <input id="search" type="search" placeholder="Search a station (e.g. Shinjuku, 新宿, Tokyo)…" autocomplete="off" />
        </label>

        <fieldset class="filters">
          <legend class="visually-hidden">Filter by accessibility</legend>
          <label class="chk">
            <input type="checkbox" id="filter-stepfree" />
            <span>Only fully step-free</span>
          </label>
          <label class="select-field">
            <span class="visually-hidden">Filter by city</span>
            <select id="filter-city">
              <option value="">All cities</option>
            </select>
          </label>
        </fieldset>
      </div>

      <p class="result-count" id="result-count" aria-live="polite"></p>
      <ul class="station-list" id="station-list"></ul>

      <p class="disclaimer" id="disclaimer"></p>
    </section>

    <section class="map-wrap" aria-label="Map of stations">
      <div id="map"></div>
    </section>
  </main>

  <aside class="detail" id="detail" hidden aria-label="Station details">
    <button class="detail-close" id="detail-close" aria-label="Close details">×</button>
    <div id="detail-body"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
