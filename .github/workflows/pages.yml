name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - main
      - "cursor/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root (static site: index.html, css/, js/, data/)
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
